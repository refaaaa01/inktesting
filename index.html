<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Paper Dashboard</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Kindle 90度旋轉定位 */
    .dashboard-wrapper {
      position: absolute;
      top: 0;
      left: 100%;
      width: 740px;
      height: 540px;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
      -webkit-transform: rotate(90deg);
      transform: rotate(90deg);
      padding: 16px;
    }

    .header-bar {
      border-bottom: 4px solid #000000;
      padding-bottom: 8px;
      height: 70px;
    }
    .date-time {
      float: left;
    }
    .time {
      font-size: 42px;
      font-weight: bold;
      line-height: 1;
    }
    .date {
      font-size: 16px;
      font-weight: bold;
      margin-top: 4px;
    }
    .weather-box {
      float: right;
      text-align: right;
    }
    .temp {
      font-size: 38px;
      font-weight: bold;
      line-height: 1;
    }
    .weather-desc {
      font-size: 15px;
      font-weight: bold;
      margin-top: 4px;
    }

    .main-content {
      clear: both;
      margin-top: 14px;
      height: 410px;
    }
    
    .panel-left {
      float: left;
      width: 50%;
      height: 100%;
      border: 3px solid #000000;
      border-radius: 6px;
      padding: 10px;
    }

    .panel-right {
      float: right;
      width: 47%;
      height: 100%;
      border: 3px solid #000000;
      border-radius: 6px;
      padding: 10px;
      position: relative;
    }

    .panel-title {
      font-size: 17px;
      font-weight: bold;
      border-bottom: 2px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }
    
    /* 輕鐵列表 */
    .train-item {
      list-style: none;
      border-bottom: 1px dashed #444444;
      padding: 6px 0;
      font-size: 15px;
      height: 36px;
      line-height: 24px;
    }
    .route-badge {
      background-color: #000000;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 15px;
    }
    .dest {
      font-weight: bold;
      margin-left: 4px;
    }
    .eta {
      float: right;
      font-weight: bold;
      font-size: 16px;
    }

    /* 精簡 Agenda 列表，騰出大空間給圖片 */
    .agenda-item {
      list-style: none;
      border-left: 3px solid #000000;
      padding-left: 6px;
      margin-bottom: 6px;
    }
    .agenda-time {
      font-size: 12px;
      font-weight: bold;
    }
    .agenda-text {
      font-size: 14px;
      font-weight: bold;
    }

    /* 加大後的圖片輪播區 */
    .image-container {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      height: 200px; /* 大幅增加高度 */
      border-top: 2px dashed #000000;
      padding-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .dashboard-img {
      max-width: 100%;
      max-height: 185px; /* 放大圖片限制 */
      -webkit-filter: grayscale(100%) contrast(115%);
      filter: grayscale(100%) contrast(115%);
      display: block;
      margin: 0 auto;
    }

    .footer-bar {
      position: absolute;
      bottom: 4px;
      right: 16px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- 頂部：時間與天氣 -->
    <div class="header-bar">
      <div class="date-time">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="full-date">載入中...</div>
      </div>
      <div class="weather-box">
        <div class="temp" id="weather-temp">--°C</div>
        <div class="weather-desc" id="weather-desc">連線中...</div>
      </div>
    </div>

    <!-- 中間主要內容 -->
    <div class="main-content">
      <!-- 左側輕鐵 -->
      <div class="panel-left">
        <div class="panel-title">輕鐵即時班次（屯門碼頭）</div>
        <ul id="train-container" style="padding: 0;">
          <li class="train-item">班次搜尋中...</li>
        </ul>
      </div>

      <!-- 右側 Agenda 與圖片 -->
      <div class="panel-right">
        <div class="panel-title">今日行程 (Agenda)</div>
        <ul style="padding: 0;">
          <li class="agenda-item">
            <div class="agenda-time">09:30 - 10:30</div>
            <div class="agenda-text">團隊早會 / 項目同步</div>
          </li>
          <li class="agenda-item">
            <div class="agenda-time">14:00 - 15:30</div>
            <div class="agenda-text">文檔本地化校對</div>
          </li>
        </ul>

        <!-- 大尺寸圖片展示區 -->
        <div class="image-container">
          <img id="slideshow-img" src="" alt="Slideshow" class="dashboard-img">
        </div>
      </div>
    </div>

    <div class="footer-bar">
      更新時間：<span id="last-updated">--:--:--</span>
    </div>
  </div>

  <script>
    // ====================================================
    // 0. 圖片設定
    // ====================================================
    var myImages = [
      "./img1.png",
      "./img2.png",
      "./img3.png"
    ];
    var currentImgIndex = 0;
    var slideImgElement = document.getElementById('slideshow-img');

    function rotateImage() {
      if (myImages.length === 0) return;
      slideImgElement.src = myImages[currentImgIndex];
      currentImgIndex = (currentImgIndex + 1) % myImages.length;
    }
    rotateImage();
    setInterval(rotateImage, 5000);

    // ====================================================
    // 1. 本地時鐘（強制轉換為香港時區 UTC+8）
    // ====================================================
    function updateClock() {
      var d = new Date();
      // 取得 UTC 毫秒數並加上 8 小時（8 * 3600 * 1000）
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      var hkDate = new Date(utc + (3600000 * 8));

      var hours = ('0' + hkDate.getHours()).slice(-2);
      var minutes = ('0' + hkDate.getMinutes()).slice(-2);
      var seconds = ('0' + hkDate.getSeconds()).slice(-2);
      document.getElementById('clock').innerHTML = hours + ':' + minutes;

      var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var dateStr = hkDate.getFullYear() + '年' + (hkDate.getMonth() + 1) + '月' + hkDate.getDate() + '日 ' + days[hkDate.getDay()];
      document.getElementById('full-date').innerHTML = dateStr;
      document.getElementById('last-updated').innerHTML = hours + ':' + minutes + ':' + seconds;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ====================================================
    // 2. 天氣 API（透過代理）
    // ====================================================
    function fetchWeather() {
      var targetUrl = encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
      var proxyUrl = 'https://api.allorigins.win/get?url=' + targetUrl;

      var xhr = new XMLHttpRequest();
      xhr.open('GET', proxyUrl, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var response = JSON.parse(xhr.responseText);
              var data = JSON.parse(response.contents);
              if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
                document.getElementById('weather-temp').innerHTML = data.temperature.data[0].value + '°C';
              }
              if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
                document.getElementById('weather-desc').innerHTML = '濕度 ' + data.humidity.data[0].value + '%';
              }
            } catch(e) {
              document.getElementById('weather-desc').innerHTML = '解析失敗';
            }
          } else {
            document.getElementById('weather-desc').innerHTML = '連線失敗';
          }
        }
      };
      xhr.send();
    }
    fetchWeather();
    setInterval(fetchWeather, 300000);

    // ====================================================
    // 3. 輕鐵 API（透過代理）
    // ====================================================
    function fetchLightRail(stationId) {
      if (!stationId) stationId = '001';
      var targetUrl = encodeURIComponent('https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=' + stationId);
      var proxyUrl = 'https://api.allorigins.win/get?url=' + targetUrl;

      var xhr = new XMLHttpRequest();
      xhr.open('GET', proxyUrl, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          var container = document.getElementById('train-container');
          if (xhr.status === 200) {
            try {
              var response = JSON.parse(xhr.responseText);
              var data = JSON.parse(response.contents);
              if (data.status === 1 && data.platform_list) {
                var html = '';
                var count = 0;
                for (var i = 0; i < data.platform_list.length; i++) {
                  var p = data.platform_list[i];
                  if (p.route_list) {
                    for (var j = 0; j < p.route_list.length; j++) {
                      if (count >= 5) break;
                      var train = p.route_list[j];
                      var eta = train.time_en === '-' ? '即將抵達' : train.time_ch;
                      html += '<li class="train-item">' +
                        '<span class="route-badge">' + train.route_no + '</span>' +
                        '<span class="dest">' + train.dest_ch + '</span>' +
                        '<span class="eta">' + eta + '</span>' +
                        '</li>';
                      count++;
                    }
                  }
                }
                container.innerHTML = count > 0 ? html : '<li class="train-item">暫無即時班次</li>';
              }
            } catch(e) {
              container.innerHTML = '<li class="train-item">班次解析失敗</li>';
            }
          } else {
            container.innerHTML = '<li class="train-item">輕鐵連線失敗</li>';
          }
        }
      };
      xhr.send();
    }
    fetchLightRail('001');
    setInterval(function() { fetchLightRail('001'); }, 30000);
  </script>
</body>
</html>
