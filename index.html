<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=no">
  <title>E-Paper Dashboard</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Kindle 橫向適配 (1200px x 840px) */
    .dashboard-wrapper {
      position: absolute;
      top: 10px;
      left: 100%;
      width: 1200px;
      height: 840px;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
      -webkit-transform: rotate(90deg);
      transform: rotate(90deg);
      padding: 20px 24px;
    }

    .header-bar {
      border-bottom: 5px solid #000000;
      padding-bottom: 10px;
      height: 95px;
    }
    .date-time {
      float: left;
    }
    .time {
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
    }
    .date {
      font-size: 22px;
      font-weight: bold;
      margin-top: 6px;
    }
    .weather-box {
      float: right;
      text-align: right;
    }
    .temp {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
    }
    .weather-desc {
      font-size: 20px;
      font-weight: bold;
      margin-top: 6px;
    }

    .main-content {
      clear: both;
      margin-top: 16px;
      height: 680px;
    }
    
    /* 左側面板：輕鐵 + 巴士 */
    .panel-left {
      float: left;
      width: 50%;
      height: 100%;
    }

    .sub-panel {
      border: 4px solid #000000;
      border-radius: 10px;
      padding: 10px 14px;
      height: 330px;
    }

    /* 右側面板：Agenda + 圖片 */
    .panel-right {
      float: right;
      width: 47%;
      height: 100%;
      border: 4px solid #000000;
      border-radius: 10px;
      padding: 12px 16px;
      position: relative;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 900;
      border-bottom: 3px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    
    /* 交通班次列表 */
    .transit-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .transit-item {
      border-bottom: 2px dashed #666666;
      padding: 4px 0;
      font-size: 20px;
      height: 48px;
      line-height: 40px;
    }
    .badge {
      background-color: #000000;
      color: #ffffff;
      padding: 1px 7px;
      border-radius: 5px;
      font-weight: 900;
      font-size: 20px;
    }
    .bus-badge {
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      padding: 0px 5px;
      border-radius: 5px;
      font-weight: 900;
      font-size: 19px;
    }
    .dest {
      font-weight: bold;
      margin-left: 6px;
    }
    .eta {
      float: right;
      font-weight: 900;
      font-size: 20px;
    }

    /* Agenda 列表 */
    .agenda-item {
      list-style: none;
      border-left: 5px solid #000000;
      padding-left: 10px;
      margin-bottom: 8px;
    }
    .agenda-time {
      font-size: 15px;
      font-weight: bold;
    }
    .agenda-text {
      font-size: 19px;
      font-weight: bold;
    }

    /* 圖片展示區 */
    .image-container {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 380px;
      border-top: 3px dashed #000000;
      padding-top: 10px;
      text-align: center;
    }
    .dashboard-img {
      max-width: 100%;
      max-height: 360px;
      -webkit-filter: grayscale(100%) contrast(120%);
      filter: grayscale(100%) contrast(120%);
      display: block;
      margin: 0 auto;
    }

    .footer-bar {
      position: absolute;
      bottom: 6px;
      right: 24px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- 頂部：時間與天氣 -->
    <div class="header-bar">
      <div class="date-time">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="full-date">載入中...</div>
      </div>
      <div class="weather-box">
        <div class="temp" id="weather-temp">--°C</div>
        <div class="weather-desc" id="weather-desc">連線中...</div>
      </div>
    </div>

    <!-- 中間主要內容 -->
    <div class="main-content">
      <!-- 左側：輕鐵 + 巴士 -->
      <div class="panel-left">
        <!-- 輕鐵 -->
        <div class="sub-panel">
          <div class="panel-title">輕鐵即時班次（最快 4 班）</div>
          <ul id="train-container" class="transit-list">
            <li class="transit-item">班次搜尋中...</li>
          </ul>
        </div>

        <!-- 巴士：59X / 59M / 59A -->
        <div class="sub-panel" style="margin-top: 16px;">
          <div class="panel-title">九巴即時班次（屯門碼頭總站）</div>
          <ul id="bus-container" class="transit-list">
            <li class="transit-item">
              <span class="bus-badge">59X</span>
              <span class="dest">旺角東站</span>
              <span class="eta" id="eta-59x">搜尋中...</span>
            </li>
            <li class="transit-item">
              <span class="bus-badge">59M</span>
              <span class="dest">荃灣站</span>
              <span class="eta" id="eta-59m">搜尋中...</span>
            </li>
            <li class="transit-item">
              <span class="bus-badge">59A</span>
              <span class="dest">葵涌葵翠邨</span>
              <span class="eta" id="eta-59a">搜尋中...</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- 右側 Agenda 與圖片 -->
      <div class="panel-right">
        <div class="panel-title">今日行程 (Agenda)</div>
        <ul id="agenda-container" style="padding: 0;">
          <li class="agenda-item">
            <div class="agenda-text">日曆同步中...</div>
          </li>
        </ul>

        <div class="image-container">
          <img id="dashboard-img" src="" alt="Photo" class="dashboard-img">
        </div>
      </div>
    </div>

    <div class="footer-bar">
      最後更新：<span id="last-updated">--:--:--</span>
    </div>
  </div>

  <script>
    // ====================================================
    // 0. 圖片輪播
    // ====================================================
    var myImages = [
      "./img1.png",
      "./img2.png",
      "./img3.png"
    ];
    var currentImgIdx = 0;
    function rotateImg() {
      if (myImages.length === 0) return;
      document.getElementById('dashboard-img').src = myImages[currentImgIdx];
      currentImgIdx = (currentImgIdx + 1) % myImages.length;
    }
    rotateImg();
    setInterval(rotateImg, 10000);

    // ====================================================
    // 1. 香港時區時鐘（UTC+8）
    // ====================================================
    function updateClock() {
      var d = new Date();
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      var hkDate = new Date(utc + (3600000 * 8));

      var hours = ('0' + hkDate.getHours()).slice(-2);
      var minutes = ('0' + hkDate.getMinutes()).slice(-2);
      var seconds = ('0' + hkDate.getSeconds()).slice(-2);
      document.getElementById('clock').innerHTML = hours + ':' + minutes;

      var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var dateStr = hkDate.getFullYear() + '年' + (hkDate.getMonth() + 1) + '月' + hkDate.getDate() + '日 ' + days[hkDate.getDay()];
      document.getElementById('full-date').innerHTML = dateStr;
      document.getElementById('last-updated').innerHTML = hours + ':' + minutes + ':' + seconds;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ====================================================
    // 2. 通用請求工具
    // ====================================================
    function fetchJSON(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            callback(data);
          } catch(e) {}
        }
      };
      xhr.send();
    }

    // ====================================================
    // 3. 香港天文台天氣 API
    // ====================================================
    function updateWeather() {
      fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(data) {
        if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
          document.getElementById('weather-temp').innerHTML = data.temperature.data[0].value + '°C';
        }
        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('weather-desc').innerHTML = '濕度 ' + data.humidity.data[0].value + '%';
        }
      });
    }
    updateWeather();
    setInterval(updateWeather, 180000);

    // ====================================================
    // 4. 輕鐵即時班次（按最快出發排序，顯示最近 4 班）
    // ====================================================
    function updateLightRail() {
      fetchJSON('https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=001', function(data) {
        var container = document.getElementById('train-container');
        if (data.status === 1 && data.platform_list) {
          var allTrains = [];
          for (var i = 0; i < data.platform_list.length; i++) {
            var p = data.platform_list[i];
            if (p.route_list) {
              for (var j = 0; j < p.route_list.length; j++) {
                var train = p.route_list[j];
                var minNum = 0;
                if (train.time_en !== '-') {
                  var m = parseInt(train.time_ch, 10);
                  minNum = isNaN(m) ? 0 : m;
                }
                allTrains.push({
                  route: train.route_no,
                  dest: train.dest_ch,
                  etaText: train.time_en === '-' ? '即將抵達' : train.time_ch,
                  min: minNum
                });
              }
            }
          }

          allTrains.sort(function(a, b) {
            return a.min - b.min;
          });

          var html = '';
          for (var k = 0; k < Math.min(4, allTrains.length); k++) {
            var t = allTrains[k];
            html += '<li class="transit-item">' +
              '<span class="badge">' + t.route + '</span>' +
              '<span class="dest">' + t.dest + '</span>' +
              '<span class="eta">' + t.etaText + '</span>' +
              '</li>';
          }
          if (html !== '') container.innerHTML = html;
        }
      });
    }
    updateLightRail();
    setInterval(updateLightRail, 15000);

    // ====================================================
    // 5. 九巴即時班次（59X / 59M / 59A 各自獨立計算）
    // ====================================================
    function parseBusETA(route, elemId) {
      fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/' + route + '/1', function(res) {
        var targetElem = document.getElementById(elemId);
        if (!targetElem) return;

        if (res && res.data) {
          var nowTime = new Date().getTime();
          var nearestMin = null;

          for (var i = 0; i < res.data.length; i++) {
            var item = res.data[i];
            if (item.eta && (item.dir === 'outbound' || item.dir === 'O' || item.seq === 1)) {
              var etaMs = new Date(item.eta).getTime();
              var diff = Math.round((etaMs - nowTime) / 60000);
              if (diff >= 0) {
                if (nearestMin === null || diff < nearestMin) {
                  nearestMin = diff;
                }
              }
            }
          }

          if (nearestMin !== null) {
            targetElem.innerHTML = nearestMin <= 1 ? '即將開出' : nearestMin + ' 分鐘';
          } else {
            targetElem.innerHTML = '非服務時間';
          }
        }
      });
    }

    function updateAllBuses() {
      parseBusETA('59X', 'eta-59x');
      parseBusETA('59M', 'eta-59m');
      parseBusETA('59A', 'eta-59a');
    }
    updateAllBuses();
    setInterval(updateAllBuses, 15000);

    // ====================================================
    // 6. Google 日曆 iCal 即時同步模組
    // ====================================================
    var icalUrl = "https://calendar.google.com/calendar/ical/mtygwcc%40gmail.com/public/basic.ics";

    function updateCalendar() {
      var proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(icalUrl);
      var xhr = new XMLHttpRequest();
      xhr.open('GET', proxy, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          parseCalendarICS(xhr.responseText);
        }
      };
      xhr.send();
    }

    function parseCalendarICS(text) {
      var d = new Date();
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      var hkDate = new Date(utc + (3600000 * 8));

      var y = hkDate.getFullYear();
      var m = ('0' + (hkDate.getMonth() + 1)).slice(-2);
      var dateNum = ('0' + hkDate.getDate()).slice(-2);
      var todayStr = '' + y + m + dateNum;

      var lines = text.split(/\r\n|\n|\r/);
      var events = [];
      var cur = null;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf('BEGIN:VEVENT') === 0) {
          cur = {};
        } else if (line.indexOf('END:VEVENT') === 0) {
          if (cur && cur.summary && cur.dtstart) {
            if (cur.dtstart.indexOf(todayStr) !== -1) {
              events.push(cur);
            }
          }
          cur = null;
        } else if (cur) {
          if (line.indexOf('SUMMARY:') === 0) {
            cur.summary = line.substring(8);
          } else if (line.indexOf('DTSTART') === 0) {
            var val = line.split(':')[1];
            cur.dtstart = val;
            if (val && val.indexOf('T') !== -1) {
              var timeStr = val.split('T')[1];
              var hh = parseInt(timeStr.substring(0, 2), 10);
              var mm = timeStr.substring(2, 4);
              if (val.indexOf('Z') !== -1) {
                hh = (hh + 8) % 24;
              }
              cur.timeText = ('0' + hh).slice(-2) + ':' + mm;
            } else {
              cur.timeText = '全天';
            }
          }
        }
      }

      renderCalendarAgenda(events);
    }

    function renderCalendarAgenda(events) {
      var container = document.getElementById('agenda-container');
      if (!events || events.length === 0) {
        container.innerHTML = '<li class="agenda-item"><div class="agenda-text">今日暫無行程</div></li>';
        return;
      }

      events.sort(function(a, b) {
        return (a.timeText || '').localeCompare(b.timeText || '');
      });

      var html = '';
      for (var i = 0; i < Math.min(3, events.length); i++) {
        var ev = events[i];
        html += '<li class="agenda-item">' +
          '<div class="agenda-time">' + ev.timeText + '</div>' +
          '<div class="agenda-text">' + ev.summary + '</div>' +
          '</li>';
      }
      container.innerHTML = html;
    }

    updateCalendar();
    setInterval(updateCalendar, 300000); // 5 分鐘同步一次日曆
  </script>
</body>
</html>
