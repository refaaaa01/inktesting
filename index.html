<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, user-scalable=no">
  <title>E-Paper Dashboard</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Kindle 橫向適配 (1200px x 840px) */
    .dashboard-wrapper {
      position: absolute;
      top: 10px;
      left: 100%;
      width: 1200px;
      height: 840px;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
      -webkit-transform: rotate(90deg);
      transform: rotate(90deg);
      padding: 20px 24px;
    }

    .header-bar {
      border-bottom: 5px solid #000000;
      padding-bottom: 10px;
      height: 95px;
    }
    .date-time {
      float: left;
    }
    .time {
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
    }
    .date {
      font-size: 22px;
      font-weight: bold;
      margin-top: 6px;
    }
    .weather-box {
      float: right;
      text-align: right;
    }
    .temp {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
    }
    .weather-desc {
      font-size: 20px;
      font-weight: bold;
      margin-top: 6px;
    }

    .main-content {
      clear: both;
      margin-top: 16px;
      height: 680px;
    }
    
    /* 左側面板：輕鐵 + 巴士 */
    .panel-left {
      float: left;
      width: 50%;
      height: 100%;
    }

    .sub-panel {
      border: 4px solid #000000;
      border-radius: 10px;
      padding: 10px 14px;
      height: 330px;
    }

    /* 右側面板：Agenda + 圖片 */
    .panel-right {
      float: right;
      width: 47%;
      height: 100%;
      border: 4px solid #000000;
      border-radius: 10px;
      padding: 12px 16px;
      position: relative;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 900;
      border-bottom: 3px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    
    /* 交通班次列表 */
    .transit-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .transit-item {
      border-bottom: 2px dashed #666666;
      padding: 4px 0;
      font-size: 20px;
      height: 48px;
      line-height: 40px;
    }
    .badge {
      background-color: #000000;
      color: #ffffff;
      padding: 1px 7px;
      border-radius: 5px;
      font-weight: 900;
      font-size: 20px;
    }
    .bus-badge {
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      padding: 0px 5px;
      border-radius: 5px;
      font-weight: 900;
      font-size: 19px;
    }
    .dest {
      font-weight: bold;
      margin-left: 6px;
    }
    .eta {
      float: right;
      font-weight: 900;
      font-size: 20px;
    }

    /* Agenda 列表 */
    .agenda-item {
      list-style: none;
      border-left: 5px solid #000000;
      padding-left: 10px;
      margin-bottom: 10px;
    }
    .agenda-time {
      font-size: 16px;
      font-weight: bold;
    }
    .agenda-text {
      font-size: 20px;
      font-weight: bold;
    }

    /* 圖片展示區 */
    .image-container {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 380px;
      border-top: 3px dashed #000000;
      padding-top: 10px;
      text-align: center;
    }
    .dashboard-img {
      max-width: 100%;
      max-height: 360px;
      -webkit-filter: grayscale(100%) contrast(120%);
      filter: grayscale(100%) contrast(120%);
      display: block;
      margin: 0 auto;
    }

    .footer-bar {
      position: absolute;
      bottom: 6px;
      right: 24px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- 頂部：時間與天氣 -->
    <div class="header-bar">
      <div class="date-time">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="full-date">載入中...</div>
      </div>
      <div class="weather-box">
        <div class="temp" id="weather-temp">--°C</div>
        <div class="weather-desc" id="weather-desc">連線中...</div>
      </div>
    </div>

    <!-- 中間主要內容 -->
    <div class="main-content">
      <!-- 左側：輕鐵 + 巴士 -->
      <div class="panel-left">
        <!-- 輕鐵：即將開出最近 4 班 -->
        <div class="sub-panel">
          <div class="panel-title">輕鐵即時班次（最近 4 班）</div>
          <ul id="train-container" class="transit-list">
            <li class="transit-item">班次搜尋中...</li>
          </ul>
        </div>

        <!-- 巴士：506 / 59X / 259B -->
        <div class="sub-panel" style="margin-top: 16px;">
          <div class="panel-title">巴士即時班次（506 / 59X / 259B）</div>
          <ul id="bus-container" class="transit-list">
            <li class="transit-item">班次搜尋中...</li>
          </ul>
        </div>
      </div>

      <!-- 右側 Agenda 與圖片 -->
      <div class="panel-right">
        <div class="panel-title">今日行程 (Agenda)</div>
        <ul style="padding: 0;">
          <li class="agenda-item">
            <div class="agenda-time">09:30 - 10:30</div>
            <div class="agenda-text">團隊早會 / 項目同步</div>
          </li>
          <li class="agenda-item">
            <div class="agenda-time">14:00 - 15:30</div>
            <div class="agenda-text">文檔本地化校對</div>
          </li>
        </ul>

        <div class="image-container">
          <img id="dashboard-img" src="" alt="Photo" class="dashboard-img">
        </div>
      </div>
    </div>

    <div class="footer-bar">
      最後更新：<span id="last-updated">--:--:--</span>
    </div>
  </div>

  <script>
    // ====================================================
    // 0. 圖片輪播
    // ====================================================
    var myImages = [
      "./img1.png",
      "./img2.png",
      "./img3.png"
    ];
    var currentImgIdx = 0;
    function rotateImg() {
      if (myImages.length === 0) return;
      document.getElementById('dashboard-img').src = myImages[currentImgIdx];
      currentImgIdx = (currentImgIdx + 1) % myImages.length;
    }
    rotateImg();
    setInterval(rotateImg, 10000);

    // ====================================================
    // 1. 香港時區時鐘（UTC+8）
    // ====================================================
    function updateClock() {
      var d = new Date();
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      var hkDate = new Date(utc + (3600000 * 8));

      var hours = ('0' + hkDate.getHours()).slice(-2);
      var minutes = ('0' + hkDate.getMinutes()).slice(-2);
      var seconds = ('0' + hkDate.getSeconds()).slice(-2);
      document.getElementById('clock').innerHTML = hours + ':' + minutes;

      var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var dateStr = hkDate.getFullYear() + '年' + (hkDate.getMonth() + 1) + '月' + hkDate.getDate() + '日 ' + days[hkDate.getDay()];
      document.getElementById('full-date').innerHTML = dateStr;
      document.getElementById('last-updated').innerHTML = hours + ':' + minutes + ':' + seconds;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ====================================================
    // 2. 通用請求工具 (支援 GET / POST)
    // ====================================================
    function fetchAPI(method, url, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      if (method === 'POST') {
        xhr.setRequestHeader('Content-Type', 'application/json');
      }
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            callback(data);
          } catch(e) {}
        }
      };
      xhr.send(body ? JSON.stringify(body) : null);
    }

    // ====================================================
    // 3. 香港天文台天氣
    // ====================================================
    function updateWeather() {
      fetchAPI('GET', 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', null, function(data) {
        if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
          document.getElementById('weather-temp').innerHTML = data.temperature.data[0].value + '°C';
        }
        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('weather-desc').innerHTML = '濕度 ' + data.humidity.data[0].value + '%';
        }
      });
    }
    updateWeather();
    setInterval(updateWeather, 180000);

    // ====================================================
    // 4. 輕鐵即時班次（由最快到最慢排序，顯示前 4 班）
    // ====================================================
    function updateLightRail() {
      fetchAPI('GET', 'https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=001', null, function(data) {
        var container = document.getElementById('train-container');
        if (data.status === 1 && data.platform_list) {
          var allTrains = [];
          for (var i = 0; i < data.platform_list.length; i++) {
            var p = data.platform_list[i];
            if (p.route_list) {
              for (var j = 0; j < p.route_list.length; j++) {
                var train = p.route_list[j];
                // 計算數值分鐘以供精確排序
                var minNum = 0;
                if (train.time_en !== '-') {
                  var m = parseInt(train.time_ch, 10);
                  minNum = isNaN(m) ? 0 : m;
                }
                allTrains.push({
                  route: train.route_no,
                  dest: train.dest_ch,
                  etaText: train.time_en === '-' ? '即將抵達' : train.time_ch,
                  min: minNum
                });
              }
            }
          }

          // 按最快開出排序（由小到大）
          allTrains.sort(function(a, b) {
            return a.min - b.min;
          });

          // 取最近 4 班
          var html = '';
          for (var k = 0; k < Math.min(4, allTrains.length); k++) {
            var t = allTrains[k];
            html += '<li class="transit-item">' +
              '<span class="badge">' + t.route + '</span>' +
              '<span class="dest">' + t.dest + '</span>' +
              '<span class="eta">' + t.etaText + '</span>' +
              '</li>';
          }
          if (html !== '') container.innerHTML = html;
        }
      });
    }
    updateLightRail();
    setInterval(updateLightRail, 15000);

    // ====================================================
    // 5. 巴士即時班次（港鐵巴士 506 + 九巴 59X / 259B）
    // ====================================================
    function updateBuses() {
      var busResults = [];
      var expectedTasks = 3;
      var finished = 0;
      var nowTime = new Date().getTime();

      function checkAndRender() {
        finished++;
        if (finished >= expectedTasks) {
          // 按剩餘分鐘數由近到遠排序
          busResults.sort(function(a, b) {
            return a.diffMin - b.diffMin;
          });

          var container = document.getElementById('bus-container');
          var html = '';
          for (var i = 0; i < Math.min(4, busResults.length); i++) {
            var b = busResults[i];
            var etaText = b.diffMin <= 1 ? '即將開出' : b.diffMin + ' 分鐘';
            html += '<li class="transit-item">' +
              '<span class="bus-badge">' + b.route + '</span>' +
              '<span class="dest">' + b.dest + '</span>' +
              '<span class="eta">' + etaText + '</span>' +
              '</li>';
          }
          container.innerHTML = html !== '' ? html : '<li class="transit-item">暫無即時班次</li>';
        }
      }

      // (1) 港鐵巴士 506 官方 API
      fetchAPI('POST', 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
        language: 'zh',
        routeName: '506'
      }, function(res) {
        if (res && res.busStop) {
          for (var i = 0; i < res.busStop.length; i++) {
            var stop = res.busStop[i];
            // 屯門碼頭總站
            if (stop.busStopId === '506-T1' || stop.busStopId === '506-01' || i === 0) {
              if (stop.bus) {
                for (var j = 0; j < stop.bus.length; j++) {
                  var bItem = stop.bus[j];
                  if (bItem.arrivalTime) {
                    var etaMs = new Date(bItem.arrivalTime).getTime();
                    var diff = Math.round((etaMs - nowTime) / 60000);
                    if (diff >= 0) {
                      busResults.push({
                        route: '506',
                        dest: '兆麟',
                        diffMin: diff
                      });
                    }
                  }
                }
              }
              break;
            }
          }
        }
        checkAndRender();
      });

      // (2) 九巴 59X
      fetchAPI('GET', 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/59X/1', null, function(res) {
        if (res && res.data) {
          for (var i = 0; i < res.data.length; i++) {
            var item = res.data[i];
            if (item.eta && (item.dir === 'outbound' || item.dir === 'O' || item.seq === 1)) {
              var etaMs = new Date(item.eta).getTime();
              var diff = Math.round((etaMs - nowTime) / 60000);
              if (diff >= 0) {
                busResults.push({
                  route: '59X',
                  dest: '旺角東站',
                  diffMin: diff
                });
              }
            }
          }
        }
        checkAndRender();
      });

      // (3) 九巴 259B
      fetchAPI('GET', 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/259B/1', null, function(res) {
        if (res && res.data) {
          for (var i = 0; i < res.data.length; i++) {
            var item = res.data[i];
            if (item.eta && (item.dir === 'outbound' || item.dir === 'O' || item.seq === 1)) {
              var etaMs = new Date(item.eta).getTime();
              var diff = Math.round((etaMs - nowTime) / 60000);
              if (diff >= 0) {
                busResults.push({
                  route: '259B',
                  dest: '九龍站',
                  diffMin: diff
                });
              }
            }
          }
        }
        checkAndRender();
      });
    }

    updateBuses();
    setInterval(updateBuses, 15000);
  </script>
</body>
</html>
