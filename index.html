<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Paper Dashboard</title>
  <style>
    /* 針對墨水屏的黑白高對比排版 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 4px solid #000000;
      padding-bottom: 12px;
    }
    .date-time {
      display: flex;
      flex-direction: column;
    }
    .time {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
    }
    .date {
      font-size: 19px;
      font-weight: bold;
      margin-top: 6px;
    }
    .weather-box {
      text-align: right;
    }
    .temp {
      font-size: 46px;
      font-weight: 900;
      line-height: 1;
    }
    .weather-desc {
      font-size: 16px;
      font-weight: bold;
      margin-top: 6px;
    }
    
    main {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      flex: 1;
      margin-top: 16px;
      min-height: 0;
    }
    
    .panel {
      border: 3px solid #000000;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .panel-title {
      font-size: 19px;
      font-weight: 900;
      border-bottom: 2px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    
    /* 輕鐵到站列表 */
    .train-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .train-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #666666;
      padding-bottom: 6px;
    }
    .route-badge {
      background-color: #000000;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 17px;
      font-weight: 900;
    }
    .dest {
      font-size: 17px;
      font-weight: bold;
      margin-left: 8px;
    }
    .eta {
      font-size: 19px;
      font-weight: 900;
    }

    /* 今日 Agenda 列表 */
    .agenda-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .agenda-item {
      display: flex;
      flex-direction: column;
      border-left: 4px solid #000000;
      padding-left: 8px;
    }
    .agenda-time {
      font-size: 13px;
      font-weight: bold;
    }
    .agenda-text {
      font-size: 16px;
      font-weight: bold;
    }

    /* 圖片輪播展示區 */
    .image-container {
      margin-top: auto;
      padding-top: 10px;
      border-top: 2px dashed #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 140px;
    }
    .dashboard-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: grayscale(100%) contrast(120%);
      border-radius: 4px;
      transition: opacity 0.3s ease-in-out;
    }

    footer {
      font-size: 12px;
      font-weight: bold;
      text-align: right;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- 頂部：時間與天氣 -->
  <header>
    <div class="date-time">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="full-date">載入中...</div>
    </div>
    <div class="weather-box">
      <div class="temp" id="weather-temp">--°C</div>
      <div class="weather-desc" id="weather-desc">正在獲取天氣...</div>
    </div>
  </header>

  <!-- 中間：輕鐵資訊 & (Agenda + 輪播圖片) -->
  <main>
    <!-- 左側：輕鐵面板 -->
    <div class="panel">
      <div class="panel-title">
        <span>輕鐵即時班次</span>
        <span id="station-name" style="font-size: 13px; align-self: center;">屯門碼頭</span>
      </div>
      <ul class="train-list" id="train-container">
        <li class="train-item">載入班次中...</li>
      </ul>
    </div>

    <!-- 右側：Agenda 與圖片面板 -->
    <div class="panel">
      <div class="panel-title">今日行程 (Agenda)</div>
      
      <!-- Agenda 列表 -->
      <ul class="agenda-list" id="agenda-container">
        <li class="agenda-item">
          <span class="agenda-time">09:30 - 10:30</span>
          <span class="agenda-text">團隊早會 / 項目同步</span>
        </li>
        <li class="agenda-item">
          <span class="agenda-time">14:00 - 15:30</span>
          <span class="agenda-text">文檔本地化校對</span>
        </li>
        <li class="agenda-item">
          <span class="agenda-time">19:00</span>
          <span class="agenda-text">住家晚飯 & 閱讀</span>
        </li>
      </ul>

      <!-- Agenda 下方的輪播圖片區域 -->
      <div class="image-container">
        <img id="slideshow-img" src="" alt="Dashboard Slideshow" class="dashboard-img">
      </div>
    </div>
  </main>

  <footer>
    資料更新時間：<span id="last-updated">--:--:--</span>
  </footer>

  <script>
    // ==========================================
    // 0. 圖片輪播清單（請將檔名替換為 yay 資料夾裡的實際檔案）
    // ==========================================
    const myImages = [
      "img1.png",
      "img2.png",
      "img3.png"
    ];

    let currentImgIndex = 0;
    const slideImgElement = document.getElementById('slideshow-img');

    function rotateImage() {
      if (myImages.length === 0) return;
      slideImgElement.src = myImages[currentImgIndex];
      // 循環切換索引
      currentImgIndex = (currentImgIndex + 1) % myImages.length;
    }

    // 初始化先載入第一張
    rotateImage();
    // 每 5000 毫秒（5 秒）切換一次圖片
    setInterval(rotateImage, 5000);

    // ==========================================
    // 1. 更新本地時間與日期
    // ==========================================
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;

      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
      document.getElementById('full-date').innerText = dateStr;
      
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('last-updated').innerText = `${hours}:${minutes}:${seconds}`;
    }

    // ==========================================
    // 2. 獲取香港天文台即時天氣
    // ==========================================
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        
        if (data.temperature && data.temperature.data.length > 0) {
          const temp = data.temperature.data[0].value;
          document.getElementById('weather-temp').innerText = `${temp}°C`;
        }
        
        if (data.humidity && data.humidity.data.length > 0) {
          const humidity = data.humidity.data[0].value;
          document.getElementById('weather-desc').innerText = `相對濕度 ${humidity}%`;
        }
      } catch (err) {
        document.getElementById('weather-desc').innerText = '天氣載入失敗';
      }
    }

    // ==========================================
    // 3. 獲取港鐵輕鐵即時到站數據
    // ==========================================
    async function fetchLightRail(stationId = '001') {
      const container = document.getElementById('train-container');
      try {
        const url = `https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${stationId}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 1 && data.platform_list) {
          container.innerHTML = '';
          let count = 0;

          for (const platform of data.platform_list) {
            if (platform.route_list) {
              for (const train of platform.route_list) {
                if (count >= 5) break;
                
                const li = document.createElement('li');
                li.className = 'train-item';
                
                const etaText = train.time_en === '-' ? '即將抵達' : train.time_ch;
                
                li.innerHTML = `
                  <div style="display: flex; align-items: center;">
                    <span class="route-badge">${train.route_no}</span>
                    <span class="dest">${train.dest_ch}</span>
                  </div>
                  <span class="eta">${etaText}</span>
                `;
                container.appendChild(li);
                count++;
              }
            }
          }

          if (count === 0) {
            container.innerHTML = '<li class="train-item">暫無即時班次資料</li>';
          }
        }
      } catch (err) {
        container.innerHTML = '<li class="train-item">輕鐵資料載入失敗</li>';
      }
    }

    // 初始化執行
    updateClock();
    fetchWeather();
    fetchLightRail('001');

    // 定時器
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 300000); // 天氣 5 分鐘更新一次
    setInterval(() => fetchLightRail('001'), 30000); // 輕鐵 30 秒更新一次
  </script>
</body>
</html>
