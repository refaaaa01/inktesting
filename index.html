<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-Paper Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      position: relative;
    }

    /* Kindle WebKit 專用 90 度旋轉定位 */
    .dashboard-wrapper {
      position: absolute;
      top: 0;
      left: 100%;
      width: 760px;   /* 橫向後的寬度（即原本螢幕高度） */
      height: 580px;  /* 橫向後的高度（即原本螢幕寬度） */
      
      /* 同時加上 -webkit 前綴以支援 Kindle 舊瀏覽器 */
      -webkit-transform-origin: top left;
      transform-origin: top left;
      
      -webkit-transform: rotate(90deg);
      transform: rotate(90deg);

      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 4px solid #000000;
      padding-bottom: 10px;
    }
    .date-time {
      display: flex;
      flex-direction: column;
    }
    .time {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
    }
    .date {
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
    }
    .weather-box {
      text-align: right;
    }
    .temp {
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
    }
    .weather-desc {
      font-size: 16px;
      font-weight: bold;
      margin-top: 4px;
    }
    
    main {
      display: flex;
      gap: 16px;
      flex: 1;
      margin-top: 12px;
      height: 420px;
    }
    
    .panel-left {
      flex: 1.1;
      border: 3px solid #000000;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .panel-right {
      flex: 0.9;
      border: 3px solid #000000;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 900;
      border-bottom: 2px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    
    /* 輕鐵到站列表 */
    .train-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .train-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #666666;
      padding-bottom: 4px;
    }
    .route-badge {
      background-color: #000000;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 900;
    }
    .dest {
      font-size: 16px;
      font-weight: bold;
      margin-left: 6px;
    }
    .eta {
      font-size: 18px;
      font-weight: 900;
    }

    /* 今日 Agenda 列表 */
    .agenda-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .agenda-item {
      display: flex;
      flex-direction: column;
      border-left: 4px solid #000000;
      padding-left: 6px;
    }
    .agenda-time {
      font-size: 12px;
      font-weight: bold;
    }
    .agenda-text {
      font-size: 15px;
      font-weight: bold;
    }

    /* 圖片輪播區 */
    .image-container {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 2px dashed #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 120px;
    }
    .dashboard-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: grayscale(100%) contrast(120%);
      -webkit-filter: grayscale(100%) contrast(120%);
      border-radius: 4px;
    }

    footer {
      font-size: 12px;
      font-weight: bold;
      text-align: right;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- 頂部：時間與天氣 -->
    <header>
      <div class="date-time">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="full-date">載入中...</div>
      </div>
      <div class="weather-box">
        <div class="temp" id="weather-temp">--°C</div>
        <div class="weather-desc" id="weather-desc">正在獲取天氣...</div>
      </div>
    </header>

    <!-- 中間：輕鐵資訊 & Agenda -->
    <main>
      <!-- 左側：輕鐵面板 -->
      <div class="panel-left">
        <div class="panel-title">
          <span>輕鐵即時班次</span>
          <span id="station-name" style="font-size: 13px; align-self: center;">屯門碼頭</span>
        </div>
        <ul class="train-list" id="train-container">
          <li class="train-item">載入班次中...</li>
        </ul>
      </div>

      <!-- 右側：Agenda 與圖片面板 -->
      <div class="panel-right">
        <div>
          <div class="panel-title">今日行程 (Agenda)</div>
          <ul class="agenda-list" id="agenda-container">
            <li class="agenda-item">
              <span class="agenda-time">09:30 - 10:30</span>
              <span class="agenda-text">團隊早會 / 項目同步</span>
            </li>
            <li class="agenda-item">
              <span class="agenda-time">14:00 - 15:30</span>
              <span class="agenda-text">文檔本地化校對</span>
            </li>
            <li class="agenda-item">
              <span class="agenda-time">19:00</span>
              <span class="agenda-text">住家晚飯 & 閱讀</span>
            </li>
          </ul>
        </div>

        <div class="image-container">
          <img id="slideshow-img" src="" alt="Slideshow" class="dashboard-img">
        </div>
      </div>
    </main>

    <footer>
      資料更新時間：<span id="last-updated">--:--:--</span>
    </footer>
  </div>

  <script>
    const myImages = [
      "img1.png",
      "img2.png",
      "img3.png"
    ];

    let currentImgIndex = 0;
    const slideImgElement = document.getElementById('slideshow-img');

    function rotateImage() {
      if (myImages.length === 0) return;
      slideImgElement.src = myImages[currentImgIndex];
      currentImgIndex = (currentImgIndex + 1) % myImages.length;
    }

    rotateImage();
    setInterval(rotateImage, 5000);

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = hours + ':' + minutes;

      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + days[now.getDay()];
      document.getElementById('full-date').innerText = dateStr;
      
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('last-updated').innerText = hours + ':' + minutes + ':' + seconds;
    }

    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        
        if (data.temperature && data.temperature.data.length > 0) {
          document.getElementById('weather-temp').innerText = data.temperature.data[0].value + '°C';
        }
        if (data.humidity && data.humidity.data.length > 0) {
          document.getElementById('weather-desc').innerText = '相對濕度 ' + data.humidity.data[0].value + '%';
        }
      } catch (err) {
        document.getElementById('weather-desc').innerText = '天氣載入失敗';
      }
    }

    async function fetchLightRail(stationId) {
      if (!stationId) stationId = '001';
      const container = document.getElementById('train-container');
      try {
        const url = 'https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=' + stationId;
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 1 && data.platform_list) {
          container.innerHTML = '';
          let count = 0;

          for (let i = 0; i < data.platform_list.length; i++) {
            const platform = data.platform_list[i];
            if (platform.route_list) {
              for (let j = 0; j < platform.route_list.length; j++) {
                if (count >= 5) break;
                const train = platform.route_list[j];
                const li = document.createElement('li');
                li.className = 'train-item';
                const etaText = train.time_en === '-' ? '即將抵達' : train.time_ch;
                
                li.innerHTML = '<div style="display: flex; align-items: center;">' +
                  '<span class="route-badge">' + train.route_no + '</span>' +
                  '<span class="dest">' + train.dest_ch + '</span>' +
                  '</div>' +
                  '<span class="eta">' + etaText + '</span>';
                container.appendChild(li);
                count++;
              }
            }
          }

          if (count === 0) {
            container.innerHTML = '<li class="train-item">暫無即時班次資料</li>';
          }
        }
      } catch (err) {
        container.innerHTML = '<li class="train-item">輕鐵資料載入失敗</li>';
      }
    }

    updateClock();
    fetchWeather();
    fetchLightRail('001');

    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 300000);
    setInterval(function() { fetchLightRail('001'); }, 30000);
  </script>
</body>
</html>
