<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <!-- 每 20 秒極速硬重整，趕車零延遲 -->
  <meta http-equiv="refresh" content="20">
  <meta name="viewport" content="width=1448, user-scalable=no">
  <title>E-Paper Dashboard</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 適配 Kindle 橫向高解析度滿版尺寸 (1380px x 1000px) */
    .dashboard-wrapper {
      position: absolute;
      top: 0;
      left: 100%;
      width: 1380px;
      height: 1000px;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
      -webkit-transform: rotate(90deg);
      transform: rotate(90deg);
      padding: 30px;
    }

    .header-bar {
      border-bottom: 6px solid #000000;
      padding-bottom: 16px;
      height: 120px;
    }
    .date-time {
      float: left;
    }
    .time {
      font-size: 76px;
      font-weight: 900;
      line-height: 1;
    }
    .date {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }
    .weather-box {
      float: right;
      text-align: right;
    }
    .temp {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
    }
    .weather-desc {
      font-size: 26px;
      font-weight: bold;
      margin-top: 8px;
    }

    .main-content {
      clear: both;
      margin-top: 24px;
      height: 780px;
    }
    
    /* 左側面板：輕鐵 + 巴士 */
    .panel-left {
      float: left;
      width: 50%;
      height: 100%;
    }

    .sub-panel {
      border: 5px solid #000000;
      border-radius: 12px;
      padding: 16px 20px;
      height: 375px;
    }

    /* 右側面板：Agenda + 圖片 */
    .panel-right {
      float: right;
      width: 47%;
      height: 100%;
      border: 5px solid #000000;
      border-radius: 12px;
      padding: 16px 20px;
      position: relative;
    }

    .panel-title {
      font-size: 30px;
      font-weight: 900;
      border-bottom: 3px solid #000000;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    
    /* 交通班次列表 */
    .transit-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .transit-item {
      border-bottom: 2px dashed #444444;
      padding: 8px 0;
      font-size: 26px;
      height: 64px;
      line-height: 48px;
    }
    .badge {
      background-color: #000000;
      color: #ffffff;
      padding: 2px 10px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 26px;
    }
    .bus-badge {
      background-color: #ffffff;
      color: #000000;
      border: 3px solid #000000;
      padding: 0px 8px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 24px;
    }
    .dest {
      font-weight: bold;
      margin-left: 10px;
    }
    .eta {
      float: right;
      font-weight: 900;
      font-size: 28px;
    }

    /* Agenda 列表 */
    .agenda-item {
      list-style: none;
      border-left: 6px solid #000000;
      padding-left: 12px;
      margin-bottom: 12px;
    }
    .agenda-time {
      font-size: 20px;
      font-weight: bold;
    }
    .agenda-text {
      font-size: 26px;
      font-weight: bold;
    }

    /* 圖片展示區 */
    .image-container {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      height: 400px;
      border-top: 3px dashed #000000;
      padding-top: 16px;
      text-align: center;
    }
    .dashboard-img {
      max-width: 100%;
      max-height: 380px;
      -webkit-filter: grayscale(100%) contrast(120%);
      filter: grayscale(100%) contrast(120%);
      display: block;
      margin: 0 auto;
    }

    .footer-bar {
      position: absolute;
      bottom: 8px;
      right: 30px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- 頂部：時間與天氣 -->
    <div class="header-bar">
      <div class="date-time">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="full-date">載入中...</div>
      </div>
      <div class="weather-box">
        <div class="temp" id="weather-temp">--°C</div>
        <div class="weather-desc" id="weather-desc">連線中...</div>
      </div>
    </div>

    <!-- 中間主要內容 -->
    <div class="main-content">
      <!-- 左側：輕鐵 + 巴士 -->
      <div class="panel-left">
        <!-- 輕鐵 -->
        <div class="sub-panel">
          <div class="panel-title">輕鐵即時班次（屯門碼頭）</div>
          <ul id="train-container" class="transit-list">
            <li class="transit-item">班次搜尋中...</li>
          </ul>
        </div>

        <!-- 巴士 -->
        <div class="sub-panel" style="margin-top: 20px;">
          <div class="panel-title">九巴即時班次（屯門碼頭開出）</div>
          <ul id="bus-container" class="transit-list">
            <li class="transit-item">班次搜尋中...</li>
          </ul>
        </div>
      </div>

      <!-- 右側 Agenda 與圖片 -->
      <div class="panel-right">
        <div class="panel-title">今日行程 (Agenda)</div>
        <ul style="padding: 0;">
          <li class="agenda-item">
            <div class="agenda-time">09:30 - 10:30</div>
            <div class="agenda-text">團隊早會 / 項目同步</div>
          </li>
          <li class="agenda-item">
            <div class="agenda-time">14:00 - 15:30</div>
            <div class="agenda-text">文檔本地化校對</div>
          </li>
        </ul>

        <div class="image-container">
          <img id="dashboard-img" src="" alt="Photo" class="dashboard-img">
        </div>
      </div>
    </div>

    <div class="footer-bar">
      更新時間：<span id="last-updated">--:--:--</span>
    </div>
  </div>

  <script>
    // 0. 圖片隨機展示
    var myImages = [
      "./img1.png",
      "./img2.png",
      "./img3.png"
    ];
    var randomIdx = Math.floor(Math.random() * myImages.length);
    document.getElementById('dashboard-img').src = myImages[randomIdx];

    // 1. 香港時區時鐘（UTC+8）
    var d = new Date();
    var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
    var hkDate = new Date(utc + (3600000 * 8));

    var hours = ('0' + hkDate.getHours()).slice(-2);
    var minutes = ('0' + hkDate.getMinutes()).slice(-2);
    var seconds = ('0' + hkDate.getSeconds()).slice(-2);
    document.getElementById('clock').innerHTML = hours + ':' + minutes;

    var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    var dateStr = hkDate.getFullYear() + '年' + (hkDate.getMonth() + 1) + '月' + hkDate.getDate() + '日 ' + days[hkDate.getDay()];
    document.getElementById('full-date').innerHTML = dateStr;
    document.getElementById('last-updated').innerHTML = hours + ':' + minutes + ':' + seconds;

    // 2. 請求函數
    function fetchJSON(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            callback(data);
          } catch(e) {}
        }
      };
      xhr.send();
    }

    // 3. 天氣 API
    fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(data) {
      if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
        document.getElementById('weather-temp').innerHTML = data.temperature.data[0].value + '°C';
      }
      if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
        document.getElementById('weather-desc').innerHTML = '濕度 ' + data.humidity.data[0].value + '%';
      }
    });

    // 4. 輕鐵 API（屯門碼頭 001）
    fetchJSON('https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=001', function(data) {
      var container = document.getElementById('train-container');
      if (data.status === 1 && data.platform_list) {
        var html = '';
        var count = 0;
        for (var i = 0; i < data.platform_list.length; i++) {
          var p = data.platform_list[i];
          if (p.route_list) {
            for (var j = 0; j < p.route_list.length; j++) {
              if (count >= 3) break;
              var train = p.route_list[j];
              var eta = train.time_en === '-' ? '即將抵達' : train.time_ch;
              html += '<li class="transit-item">' +
                '<span class="badge">' + train.route_no + '</span>' +
                '<span class="dest">' + train.dest_ch + '</span>' +
                '<span class="eta">' + eta + '</span>' +
                '</li>';
              count++;
            }
          }
        }
        if (count > 0) container.innerHTML = html;
      }
    });

    // 5. 九巴 API（屯門碼頭總站開出）
    fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/TU03-T-1000-0', function(res) {
      var container = document.getElementById('bus-container');
      if (res && res.data) {
        var html = '';
        var count = 0;
        var nowTime = new Date().getTime();

        for (var i = 0; i < res.data.length; i++) {
          var item = res.data[i];
          if (item.eta && count < 3) {
            var etaTime = new Date(item.eta).getTime();
            var diffMin = Math.round((etaTime - nowTime) / 60000);
            if (diffMin >= 0) {
              var etaText = diffMin <= 1 ? '即將開出' : diffMin + ' 分鐘';
              html += '<li class="transit-item">' +
                '<span class="bus-badge">' + item.route + '</span>' +
                '<span class="dest">' + item.dest_tc + '</span>' +
                '<span class="eta">' + etaText + '</span>' +
                '</li>';
              count++;
            }
          }
        }
        if (count > 0) container.innerHTML = html;
      }
    });
  </script>
</body>
</html>
