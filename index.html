<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Paper Dashboard</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Kindle 90度旋轉定位 */
    .dashboard-wrapper {
      position: absolute;
      top: 0;
      left: 100%;
      width: 740px;
      height: 540px;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
      -webkit-transform: rotate(90deg);
      transform: rotate(90deg);
      padding: 16px;
    }

    .header-bar {
      border-bottom: 4px solid #000000;
      padding-bottom: 8px;
      height: 70px;
    }
    .date-time {
      float: left;
    }
    .time {
      font-size: 42px;
      font-weight: bold;
      line-height: 1;
    }
    .date {
      font-size: 16px;
      font-weight: bold;
      margin-top: 4px;
    }
    .weather-box {
      float: right;
      text-align: right;
    }
    .temp {
      font-size: 38px;
      font-weight: bold;
      line-height: 1;
    }
    .weather-desc {
      font-size: 15px;
      font-weight: bold;
      margin-top: 4px;
    }

    .main-content {
      clear: both;
      margin-top: 14px;
      height: 410px;
    }
    
    .panel-left {
      float: left;
      width: 50%;
      height: 100%;
      border: 3px solid #000000;
      border-radius: 6px;
      padding: 10px;
    }

    .panel-right {
      float: right;
      width: 47%;
      height: 100%;
      border: 3px solid #000000;
      border-radius: 6px;
      padding: 10px;
      position: relative;
    }

    .panel-title {
      font-size: 17px;
      font-weight: bold;
      border-bottom: 2px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }
    
    /* 輕鐵列表 */
    .train-item {
      list-style: none;
      border-bottom: 1px dashed #444444;
      padding: 6px 0;
      font-size: 15px;
      height: 36px;
      line-height: 24px;
    }
    .route-badge {
      background-color: #000000;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 15px;
    }
    .dest {
      font-weight: bold;
      margin-left: 4px;
    }
    .eta {
      float: right;
      font-weight: bold;
      font-size: 16px;
    }

    /* Agenda 列表 */
    .agenda-item {
      list-style: none;
      border-left: 3px solid #000000;
      padding-left: 6px;
      margin-bottom: 6px;
    }
    .agenda-time {
      font-size: 12px;
      font-weight: bold;
    }
    .agenda-text {
      font-size: 14px;
      font-weight: bold;
    }

    /* 圖片輪播區 */
    .image-container {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      height: 200px;
      border-top: 2px dashed #000000;
      padding-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .dashboard-img {
      max-width: 100%;
      max-height: 185px;
      -webkit-filter: grayscale(100%) contrast(115%);
      filter: grayscale(100%) contrast(115%);
      display: block;
      margin: 0 auto;
    }

    .footer-bar {
      position: absolute;
      bottom: 4px;
      right: 16px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- 頂部：時間與天氣 -->
    <div class="header-bar">
      <div class="date-time">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="full-date">載入中...</div>
      </div>
      <div class="weather-box">
        <div class="temp" id="weather-temp">--°C</div>
        <div class="weather-desc" id="weather-desc">連線中...</div>
      </div>
    </div>

    <!-- 中間主要內容 -->
    <div class="main-content">
      <!-- 左側輕鐵 -->
      <div class="panel-left">
        <div class="panel-title">輕鐵即時班次（屯門碼頭）</div>
        <ul id="train-container" style="padding: 0;">
          <li class="train-item">班次搜尋中...</li>
        </ul>
      </div>

      <!-- 右側 Agenda 與圖片 -->
      <div class="panel-right">
        <div class="panel-title">今日行程 (Agenda)</div>
        <ul style="padding: 0;">
          <li class="agenda-item">
            <div class="agenda-time">09:30 - 10:30</div>
            <div class="agenda-text">團隊早會 / 項目同步</div>
          </li>
          <li class="agenda-item">
            <div class="agenda-time">14:00 - 15:30</div>
            <div class="agenda-text">文檔本地化校對</div>
          </li>
        </ul>

        <div class="image-container">
          <img id="slideshow-img" src="" alt="Slideshow" class="dashboard-img">
        </div>
      </div>
    </div>

    <div class="footer-bar">
      更新時間：<span id="last-updated">--:--:--</span>
    </div>
  </div>

  <script>
    // ====================================================
    // 0. 圖片設定
    // ====================================================
    var myImages = [
      "./img1.png",
      "./img2.png",
      "./img3.png"
    ];
    var currentImgIndex = 0;
    var slideImgElement = document.getElementById('slideshow-img');

    function rotateImage() {
      if (myImages.length === 0) return;
      slideImgElement.src = myImages[currentImgIndex];
      currentImgIndex = (currentImgIndex + 1) % myImages.length;
    }
    rotateImage();
    setInterval(rotateImage, 5000);

    // ====================================================
    // 1. 香港時區時鐘（UTC+8）
    // ====================================================
    function updateClock() {
      var d = new Date();
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      var hkDate = new Date(utc + (3600000 * 8));

      var hours = ('0' + hkDate.getHours()).slice(-2);
      var minutes = ('0' + hkDate.getMinutes()).slice(-2);
      var seconds = ('0' + hkDate.getSeconds()).slice(-2);
      document.getElementById('clock').innerHTML = hours + ':' + minutes;

      var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var dateStr = hkDate.getFullYear() + '年' + (hkDate.getMonth() + 1) + '月' + hkDate.getDate() + '日 ' + days[hkDate.getDay()];
      document.getElementById('full-date').innerHTML = dateStr;
      document.getElementById('last-updated').innerHTML = hours + ':' + minutes + ':' + seconds;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ====================================================
    // 2. 通用高可用請求函數（自動 Fallback 代理）
    // ====================================================
    function requestWithFallback(targetUrl, successCallback, failCallback) {
      // 代理 A：CorsProxy.io (極快且直接回傳 JSON)
      var proxyA = 'https://corsproxy.io/?url=' + encodeURIComponent(targetUrl);
      var xhrA = new XMLHttpRequest();
      xhrA.open('GET', proxyA, true);
      xhrA.timeout = 6000;

      xhrA.onreadystatechange = function() {
        if (xhrA.readyState === 4) {
          if (xhrA.status === 200) {
            try {
              var data = JSON.parse(xhrA.responseText);
              successCallback(data);
              return;
            } catch(e) {}
          }
          // 若代理 A 失敗，嘗試代理 B：AllOrigins
          useFallbackB();
        }
      };
      xhrA.ontimeout = useFallbackB;
      xhrA.onerror = useFallbackB;
      xhrA.send();

      function useFallbackB() {
        var proxyB = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);
        var xhrB = new XMLHttpRequest();
        xhrB.open('GET', proxyB, true);
        xhrB.timeout = 8000;
        xhrB.onreadystatechange = function() {
          if (xhrB.readyState === 4) {
            if (xhrB.status === 200) {
              try {
                var res = JSON.parse(xhrB.responseText);
                var data = JSON.parse(res.contents);
                successCallback(data);
                return;
              } catch(e) {}
            }
            if (failCallback) failCallback();
          }
        };
        xhrB.ontimeout = function() { if (failCallback) failCallback(); };
        xhrB.onerror = function() { if (failCallback) failCallback(); };
        xhrB.send();
      }
    }

    // ====================================================
    // 3. 天氣 API
    // ====================================================
    function fetchWeather() {
      var weatherUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
      requestWithFallback(weatherUrl, function(data) {
        if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
          document.getElementById('weather-temp').innerHTML = data.temperature.data[0].value + '°C';
        }
        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('weather-desc').innerHTML = '濕度 ' + data.humidity.data[0].value + '%';
        }
      });
    }
    fetchWeather();
    setInterval(fetchWeather, 300000);

    // ====================================================
    // 4. 輕鐵 API
    // ====================================================
    function fetchLightRail(stationId) {
      if (!stationId) stationId = '001';
      var railUrl = 'https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=' + stationId;
      var container = document.getElementById('train-container');

      requestWithFallback(railUrl, function(data) {
        if (data.status === 1 && data.platform_list) {
          var html = '';
          var count = 0;
          for (var i = 0; i < data.platform_list.length; i++) {
            var p = data.platform_list[i];
            if (p.route_list) {
              for (var j = 0; j < p.route_list.length; j++) {
                if (count >= 5) break;
                var train = p.route_list[j];
                var eta = train.time_en === '-' ? '即將抵達' : train.time_ch;
                html += '<li class="train-item">' +
                  '<span class="route-badge">' + train.route_no + '</span>' +
                  '<span class="dest">' + train.dest_ch + '</span>' +
                  '<span class="eta">' + eta + '</span>' +
                  '</li>';
                count++;
              }
            }
          }
          if (count > 0) {
            container.innerHTML = html;
          }
        }
      });
    }
    fetchLightRail('001');
    setInterval(function() { fetchLightRail('001'); }, 30000);
  </script>
</body>
</html>
